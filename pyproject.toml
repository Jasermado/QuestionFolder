[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "question-folder"
version = "1.1.0"
description = "A transparent screenshot-based study assistant for permitted learning environments."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jaser Mohamed"}]
dependencies = [
  "openai>=1.0.0",
  "Pillow>=10.0.0",
  "pynput>=1.7.7",
  "pyperclip>=1.8.2",
  "python-dotenv>=1.0.1",
  "winotify>=1.1.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
question-folder = "question_folder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
